<!DOCTYPE html>
<html>
<head>
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>My Notes</h1>
    <div id="login-form">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
    <div class="note-form-container">
        <h2 id="note-form-title">Create New Note</h2>
        <div class="form-group">
            <input type="text" id="title" placeholder="Note title" class="note-form">
        </div>
        <div class="form-group">
            <textarea id="content" placeholder="Note content" class="note-form"></textarea>
        </div>
        <div class="form-actions">
            <button id="submit-btn" onclick="saveNote()" class="btn btn-primary">Create</button>
            <button onclick="newNoteMode()" class="btn btn-secondary" id="cancel-btn" style="display:none;">Cancel</button>
        </div>
    </div>

    <div id="notes-list" class="notes-grid"></div>
</div>

<script src="script.js"></script>
</body>
</html>
